<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>ColorFly Studio</title>
</head>
<body>
    <div class="card">
        <img src="./assets/fondopaleta.jpg" alt="fondopaleta" class="otro">
    </div>   
    <header>
    <h1> 🖌️ColorFly Studio</h1>
    <h2 class="h2">Generador de paletas de colores</h2>
    </header>
         <main id="tamaño-de-la-paleta">

            <div id="paleta" class="paleta">
                <div class="field">
                    <label for="colores">Cantidad de colores</label>
                    <select id="colores" name="colores">
                        <option value="6">6 colores</option>
                        <option value="8">8 colores</option>
                        <option value="9">9 colores</option>
                    </select>
                </div>
                <div class="field">
                    <label for="formato">Formato del código</label>
                    <select id="formato" name="formato" class="formato">
                        <option value="hex">HEX</option>
                        <option value="rgba">RGBA</option>
                    </select>
                 </div>
            <button id="boton-generar" class="boton-generar" type="button">Generar paleta</button>
            </div>
        <div id="mostrar-colores">
        </div>
   </main>
   <footer id="acerca">
        <p>2026</p>
    </footer>
<script src="./js/script.js"></script>
</body>
</html>
